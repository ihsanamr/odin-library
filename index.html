<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin - My Library</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>My Library</h1>
      <button id="add-new-btn">Add New Book</button>
    </header>

    <main>
      <div id="library-container" class="library-container"></div>
    </main>

    <dialog id="add-book-dialog">
      <form id="book-form" method="dialog">
        <h2>Add New Book</h2>

        <div class="input-section">
          <label for="book-title">Title:</label>
          <input type="text" id="book-title" name="title" required />
        </div>
        <div class="input-section">
          <label for="book-author">Author:</label>
          <input type="text" id="book-author" name="author" required />
        </div>
        <div class="input-section">
          <label for="book-pages">Pages:</label>
          <input type="number" id="book-pages" name="pages" required />
        </div>
        <div class="input-section-checkbox">
          <label for="book-read-status">Already read?</label>
          <input
            type="checkbox"
            id="book-read-status"
            name="book-read-status"
          />
        </div>

        <div class="form-btn">
          <button type="submit" id="confirm-btn">Add Book</button>
          <button type="button" id="cancel-btn">Cancel</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
